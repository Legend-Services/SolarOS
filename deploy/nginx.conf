# Long-lived caching for hashed build assets; the security headers below then still apply to them (an add_header
# inside a location would drop every server-level header there).
map $uri $solardeck_cache {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "";
}
# The API docs page (/api/docs) loads its viewer from a CDN with inline scripts: no CSP there.
map $uri $solardeck_csp {
    ~^/api/docs "";
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # HTTPS on 443 once a certificate is applied in Network & Services → Certificates (glob: no file, no error).
    # <prefix>-ssl.conf (written by selfsigned-cert.sh or Network & Services); a glob, so no file is no error.
    include /etc/nginx/*-ssl.conf;

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $solardeck_csp always;
    add_header Cache-Control $solardeck_cache;

    root /opt/solardeck/frontend/dist;
    index index.html;
    client_max_body_size 0;

    # Console WebSockets (noVNC / xterm.js relays).
    location /api/v1/ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
