name: Release validation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build (TypeScript + Vite)
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Both drivers load and register their routes
        working-directory: backend
        env:
          ADMIN_PASSWORD: ci
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          STORAGE_ROOT: /tmp/solardeck-ci
        run: |
          python -c "from providers.proxmox.provider import ProxmoxProvider; from providers.native_ubuntu.provider import NativeUbuntuProvider; print(ProxmoxProvider().get_capabilities().driver, NativeUbuntuProvider().get_capabilities().driver)"
          for driver in proxmox native_ubuntu; do
            HYPERVISOR_DRIVER=$driver python -c "
          from fastapi.routing import APIRoute
          from app.main import app
          paths = {r.path for r in app.routes if isinstance(r, APIRoute)}
          assert {'/api/v1/guests', '/api/v1/guests', '/api/system/updates/apply', '/api/system/updates/iso', '/api/v1/system/capabilities'} <= paths
          print('$driver:', len(paths), 'routes')"
          done
      - name: Backend self-checks
        working-directory: backend
        run: for t in tests/test_*.py; do python -m "tests.$(basename "$t" .py)"; done
      - name: Installer and appliance scripts
        run: |
          for f in install.sh deploy.sh deploy/*.sh hypervisor/*.sh; do bash -n "$f"; done
          python3 hypervisor/solardeck-console-tui.py --self-test
          bash deploy/test-helper-proxmox.sh
          # The SolarOS tree must not contain anything of the other edition (fails with the offending files).
          bash deploy/make-edition-tree.sh solaros . "$RUNNER_TEMP/solaros-check"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Appliance scripts syntax
        run: bash -n hypervisor/build-iso.sh hypervisor/install-hypervisor.sh hypervisor/firstboot-setup.sh hypervisor/test-in-proxmox-vm.sh
      - name: Publish release notes and installer scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The CHANGELOG section of this version is the release body.
          awk -v v="## ${GITHUB_REF_NAME} " 'index($0, v) == 1 {p = 1; print; next} /^## v/ && p {exit} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "SolarDeck ${GITHUB_REF_NAME}" > "$RUNNER_TEMP/notes.md"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" --clobber install.sh hypervisor/install-hypervisor.sh hypervisor/build-iso.sh \
            || gh release create "$GITHUB_REF_NAME" --title "SolarDeck ${GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/notes.md" \
                 install.sh hypervisor/install-hypervisor.sh hypervisor/build-iso.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish the SolarOS release branch
        # SolarOS installs update from the "solaros" branch: the SolarOS edition tree only (deploy/make-edition-tree.sh
        # removes every other edition and fails if a trace is left), one commit per release, tagged solaros-<version>.
        run: |
          bash deploy/make-edition-tree.sh solaros . "$RUNNER_TEMP/solaros"
          # SolarOS ships the built desktop, so its hosts need no Node.js toolchain.
          (cd "$RUNNER_TEMP/solaros/frontend" && npm ci --no-audit --no-fund && VITE_EDITION=solaros npm run build && rm -rf node_modules)
          git config user.name "SolarDeck release" && git config user.email "release@users.noreply.github.com"
          git fetch -q --no-tags origin solaros:refs/remotes/origin/solaros || true
          git worktree add -q --detach "$RUNNER_TEMP/branch"
          cd "$RUNNER_TEMP/branch"
          if git rev-parse -q --verify origin/solaros >/dev/null; then git checkout -q -B solaros origin/solaros; else git checkout -q --orphan solaros; fi
          git rm -rq --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/solaros/." .
          git add -A && git add -f frontend/dist
          git commit -q -m "SolarOS ${GITHUB_REF_NAME}" || echo "no changes"
          git tag -f "solaros-${GITHUB_REF_NAME}"
          git push -q origin solaros "refs/tags/solaros-${GITHUB_REF_NAME}" --force-with-lease=solaros
